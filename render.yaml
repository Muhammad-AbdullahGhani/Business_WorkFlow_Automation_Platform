services:
  # Backend FastAPI Web Service (Free Tier on Render)
  - type: web
    name: smartflow-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./smartflow.db
      - key: LLM_PROVIDER
        value: auto
      - key: CORS_ORIGINS
        value: "*"
